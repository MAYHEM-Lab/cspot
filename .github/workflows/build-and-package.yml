name: Build and Test

on: 
  push:
    branches:
      - caplets

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Debug

jobs:
  build-and-test:
    runs-on: [self-hosted, X64]
    # The CMake configure and build commands are platform agnostic and should work equally
    # well on Windows or Mac.  You can convert this to a matrix build if you need
    # cross-platform coverage
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    steps:
    - name: checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: configure with cmake
      run: |
        mkdir -p build
        cd build
        cmake -DCMAKE_TOOLCHAIN_FILE=../toolchain-musl.cmake DCMAKE_BUILD_TYPE=$BUILD_TYPE -DENABLE_PYCSPOT=OFF ..
        make
    - name: run self tests
      run: |
        cd build/bin
        cp ../../cicd-tests/local-self-test.sh .
        ./woofc-namespace-platform -b spawn >& namespace.log &
        ./local-self-test.sh
        cp ../../cicd-tests/local-network-test.sh .
        ./woofc-namespace-platform -b spawn >& namespace.log &
        ./local-network-test.sh
        cp ../../cicd-tests/start-remote-platform.sh .
        cp ../../cicd-tests/kill-remote-platform.sh .
        cp ../../cicd-tests/remote-network-test.sh .
        ./remote-network-test.sh
        cp ../../cicd-tests/remote-senspot-test.sh .
        ./remote-senspot-test.sh
  build-and-test-rpi:
    runs-on: [self-hosted, ARM64]
    # The CMake configure and build commands are platform agnostic and should work equally
    # well on Windows or Mac.  You can convert this to a matrix build if you need
    # cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    steps:
    - name: checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: configure with cmake
      run: |
        mkdir -p build
        cd build
        cmake ..
        make -j4
    - name: run self tests
      run: |
        cd build/bin
        cp ../../cicd-tests/local-self-test.sh .
        ./woofc-namespace-platform -b spawn >& namespace.log &
        ./local-self-test.sh
        cp ../../cicd-tests/local-network-test.sh .
        ./woofc-namespace-platform -b spawn >& namespace.log &
        ./local-network-test.sh
        cp ../../cicd-tests/start-remote-platform.sh .
        cp ../../cicd-tests/kill-remote-platform.sh .
        cp ../../cicd-tests/remote-network-test.sh .
        ./remote-network-test.sh
        cp ../../cicd-tests/remote-senspot-test.sh .
        ./remote-senspot-test.sh
    - name: Install Debian Build and Repo Dependencies
      run: |
        echo "Updating package lists and installing build tools..."
        sudo apt update
        sudo apt install -y devscripts build-essential dpkg-dev gzip
    - name: Build Debian Package
      run: |
        echo "Starting package build with debuild..."
        debuild -us -uc
    - name: Generate APT Index and Prepare Directory
      run: |
        echo "Preparing APT repository structure..."
        mkdir -p repo
        find .. -name "*.deb" -exec cp {} repo/ \;
        echo "Generating Packages.gz index file..."
        cd repo
        dpkg-scanpackages . /dev/null | gzip -9c > Packages.gz
    - name: Publish APT Repository to arm64-apt-repo branch
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./repo 
        publish_branch: arm64-apt-repo 
        force_orphan: true 
        commit_message: "Auto-publish new package ${{ github.sha }}"
