name: Build, Test, and Release

on:
  push:
    branches:
      - caplets

env:
  BUILD_TYPE: Debug

jobs:
  build-and-release:
    runs-on: [self-hosted]

    strategy:
      matrix:
        arch: [x86_64, arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure and build
        run: |
          mkdir -p build
          cd build
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            cmake -DCMAKE_TOOLCHAIN_FILE=../toolchain-musl.cmake -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DENABLE_PYCSPOT=OFF ..
          else
            cmake ..
          fi
          make -j$(nproc)

      - name: Run self tests
        run: |
          cd build/bin
          cp ../../cicd-tests/local-self-test.sh .
          ./woofc-namespace-platform -b spawn >& namespace.log &
          ./local-self-test.sh
          cp ../../cicd-tests/local-network-test.sh .
          ./woofc-namespace-platform -b spawn >& namespace.log &
          ./local-network-test.sh
          cp ../../cicd-tests/start-remote-platform.sh .
          cp ../../cicd-tests/kill-remote-platform.sh .
          cp ../../cicd-tests/remote-network-test.sh .
          ./remote-network-test.sh
          cp ../../cicd-tests/remote-senspot-test.sh .
          ./remote-senspot-test.sh

      - name: Save build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: cspot-build-${{ matrix.arch }}
          path: build/bin

  package-and-release:
    needs: build-and-release
    runs-on: [self-hosted]

    strategy:
      matrix:
        arch: [x86_64, arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: cspot-build-${{ matrix.arch }}
          path: build/bin

      - name: Package prebuilt binaries into .deb
        id: package
        run: |
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            ARCH=amd64
          else
            ARCH=arm64
          fi
          PKG_NAME="cspot-${ARCH}.deb"
          echo "DEBUG: Packaging for ARCH=${ARCH} -> ${PKG_NAME}"

          PKG_DIR=pkg
          rm -rf $PKG_DIR
          mkdir -p $PKG_DIR/DEBIAN
          mkdir -p $PKG_DIR/usr/local/cspot/bin
          mkdir -p $PKG_DIR/usr/local/cspot/lib
          mkdir -p $PKG_DIR/usr/local/cspot/include

          cp build/bin/* $PKG_DIR/usr/local/cspot/bin/
          cp build/lib/* $PKG_DIR/usr/local/cspot/lib/ || true
          cp src/include/*.h $PKG_DIR/usr/local/cspot/include/ || true

          cat <<EOF > $PKG_DIR/DEBIAN/control
Package: cspot
Version: 1.0-${GITHUB_SHA}
Architecture: ${ARCH}
Maintainer: Rich <rich@cs.ucsb.edu>
Description: CSPOT platform runtime (${ARCH})
EOF

          dpkg-deb --build $PKG_DIR $PKG_NAME
          echo "DEBUG: Package created at $PKG_NAME"

          # Set output for next step
          echo "pkg_name=${PKG_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .deb to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.package.outputs.pkg_name }}
          asset_name: ${{ steps.package.outputs.pkg_name }}
          asset_content_type: application/vnd.debian.binary-package


