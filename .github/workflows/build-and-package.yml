name: Build, Test, and Release

on:
  push:
    branches:
      - caplets

env:
  BUILD_TYPE: Debug

jobs:
  build-and-release:
    runs-on: [self-hosted]

    strategy:
      matrix:
        arch: [x86_64, arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set architecture-specific variables
        run: |
          if [ "${{ matrix.arch }}" == "x86_64" ]; then
            echo "ARCH=amd64" >> $GITHUB_ENV
          else
            echo "ARCH=arm64" >> $GITHUB_ENV
          fi
          echo "PKG_NAME=cspot-${ARCH}.deb" >> $GITHUB_ENV

      - name: Configure and build
        run: |
          mkdir -p build
          cd build
          if [ "${ARCH}" = "amd64" ]; then
            cmake -DCMAKE_TOOLCHAIN_FILE=../toolchain-musl.cmake -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DENABLE_PYCSPOT=OFF ..
          else
            cmake ..
          fi
          make -j$(nproc)

      - name: Run self tests
        run: |
          cd build/bin
          cp ../../cicd-tests/local-self-test.sh .
          ./woofc-namespace-platform -b spawn >& namespace.log &
          ./local-self-test.sh
          cp ../../cicd-tests/local-network-test.sh .
          ./woofc-namespace-platform -b spawn >& namespace.log &
          ./local-network-test.sh
          cp ../../cicd-tests/start-remote-platform.sh .
          cp ../../cicd-tests/kill-remote-platform.sh .
          cp ../../cicd-tests/remote-network-test.sh .
          ./remote-network-test.sh
          cp ../../cicd-tests/remote-senspot-test.sh .
          ./remote-senspot-test.sh

      - name: Package prebuilt binaries into .deb
        run: |
          PKG_DIR=pkg
          mkdir -p $PKG_DIR/DEBIAN
          mkdir -p $PKG_DIR/usr/local/cspot/bin
          mkdir -p $PKG_DIR/usr/local/cspot/lib
          mkdir -p $PKG_DIR/usr/local/cspot/include

          cp build/bin/* $PKG_DIR/usr/local/cspot/bin/
          cp build/lib/* $PKG_DIR/usr/local/cspot/lib/
          cp src/include/*.h $PKG_DIR/usr/local/cspot/include/

          # Generate minimal control file
          echo "Package: cspot" > $PKG_DIR/DEBIAN/control
          echo "Version: 1.0-${GITHUB_SHA}" >> $PKG_DIR/DEBIAN/control
          echo "Architecture: ${ARCH}" >> $PKG_DIR/DEBIAN/control
          echo "Maintainer: Rich <rich@cs.ucsb.edu>" >> $PKG_DIR/DEBIAN/control
          echo "Description: CSPOT platform runtime (${ARCH})" >> $PKG_DIR/DEBIAN/control

          dpkg-deb --build $PKG_DIR $PKG_NAME

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .deb to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.PKG_NAME }}
          asset_name: ${{ env.PKG_NAME }}
          asset_content_type: application/vnd.debian.binary-package


