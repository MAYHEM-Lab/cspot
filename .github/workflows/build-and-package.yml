name: Build and Test

on:
  push:
    branches:
      - caplets

env:
  BUILD_TYPE: Debug

jobs:

  build-and-test-x86:
    runs-on: [self-hosted, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure and build
        run: |
          mkdir -p build
          cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=../toolchain-musl.cmake -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DENABLE_PYCSPOT=OFF ..
          make -j$(nproc)

      - name: Run self tests
        run: |
          cd build/bin
          cp ../../cicd-tests/local-self-test.sh .
          ./woofc-namespace-platform -b spawn >& namespace.log &
          ./local-self-test.sh
          cp ../../cicd-tests/local-network-test.sh .
          ./woofc-namespace-platform -b spawn >& namespace.log &
          ./local-network-test.sh
          cp ../../cicd-tests/start-remote-platform.sh .
          cp ../../cicd-tests/kill-remote-platform.sh .
          cp ../../cicd-tests/remote-network-test.sh .
          ./remote-network-test.sh
          cp ../../cicd-tests/remote-senspot-test.sh .
          ./remote-senspot-test.sh

      - name: Package prebuilt binaries into .deb (x86_64)
        run: |
          PKG_DIR=pkg
          mkdir -p $PKG_DIR/DEBIAN
          mkdir -p $PKG_DIR/usr/local/cspot/bin
          mkdir -p $PKG_DIR/usr/local/cspot/lib
          mkdir -p $PKG_DIR/usr/local/cspot/include

          cp build/bin/* $PKG_DIR/usr/local/cspot/bin/
          cp build/lib/* $PKG_DIR/usr/local/cspot/lib/
          cp src/include/*.h $PKG_DIR/usr/local/cspot/include/

          # Use echo to write the control file line by line
          echo "Package: cspot" > $PKG_DIR/DEBIAN/control
          echo "Version: 1.0-${GITHUB_SHA}" >> $PKG_DIR/DEBIAN/control
          echo "Architecture: amd64" >> $PKG_DIR/DEBIAN/control
          echo "Maintainer: Rich <rich@cs.ucsb.edu>" >> $PKG_DIR/DEBIAN/control
          echo "Description: CSPOT platform runtime (x86_64)" >> $PKG_DIR/DEBIAN/control

          dpkg-deb --build $PKG_DIR cspot-amd64.deb

      - name: Prepare APT repository (x86_64)
        run: |
          mkdir -p repo
          cp cspot-amd64.deb repo/
          cd repo
          dpkg-scanpackages . /dev/null | gzip -9c > Packages.gz

      - name: Publish APT repository (x86_64)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: x86-apt-repo
          force_orphan: true
          commit_message: "Publish x86 package ${{ github.sha }}"

  build-and-test-arm64:
    runs-on: [self-hosted, ARM64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure and build
        run: |
          mkdir -p build
          cd build
          cmake ..
          make -j$(nproc)

      - name: Run self tests
        run: |
          cd build/bin
          cp ../../cicd-tests/local-self-test.sh .
          ./woofc-namespace-platform -b spawn >& namespace.log &
          ./local-self-test.sh
          cp ../../cicd-tests/local-network-test.sh .
          ./woofc-namespace-platform -b spawn >& namespace.log &
          ./local-network-test.sh
          cp ../../cicd-tests/start-remote-platform.sh .
          cp ../../cicd-tests/kill-remote-platform.sh .
          cp ../../cicd-tests/remote-network-test.sh .
          ./remote-network-test.sh
          cp ../../cicd-tests/remote-senspot-test.sh .
          ./remote-senspot-test.sh

      - name: Package prebuilt binaries into .deb (ARM64)
        run: |
          PKG_DIR=pkg
          mkdir -p $PKG_DIR/DEBIAN
          mkdir -p $PKG_DIR/usr/local/cspot/bin
          mkdir -p $PKG_DIR/usr/local/cspot/lib
          mkdir -p $PKG_DIR/usr/local/cspot/include

          cp build/bin/* $PKG_DIR/usr/local/cspot/bin/
          cp build/lib/* $PKG_DIR/usr/local/cspot/lib/
          cp src/include/*.h $PKG_DIR/usr/local/cspot/include/

          echo "Package: cspot" > $PKG_DIR/DEBIAN/control
          echo "Version: 1.0-${GITHUB_SHA}" >> $PKG_DIR/DEBIAN/control
          echo "Architecture: arm64" >> $PKG_DIR/DEBIAN/control
          echo "Maintainer: Rich <rich@cs.ucsb.edu>" >> $PKG_DIR/DEBIAN/control
          echo "Description: CSPOT platform runtime (ARM64)" >> $PKG_DIR/DEBIAN/control

          dpkg-deb --build $PKG_DIR cspot-arm64.deb

      - name: Prepare APT repository (ARM64)
        run: |
          mkdir -p repo
          cp cspot-arm64.deb repo/
          cd repo
          dpkg-scanpackages . /dev/null | gzip -9c > Packages.gz

      - name: Publish APT repository (ARM64)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: arm64-apt-repo
          force_orphan: true
          commit_message: "Publish ARM64 package ${{ github.sha }}"
