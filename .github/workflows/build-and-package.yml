name: Build, Test, and Package

on:
  push:
    branches:
      - caplets

jobs:
  build-and-package:
    name: Build & Package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: [self-hosted, X64]
          - arch: arm64
            runner: [self-hosted, ARM64]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure and build
        run: |
          mkdir -p build
          cd build
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=../toolchain-musl.cmake -DENABLE_PYCSPOT=OFF ..
          else
            cmake -DCMAKE_BUILD_TYPE=Release ..
          fi
          make -j4

      - name: Run self tests
        run: |
          cd build/bin
          cp ../../cicd-tests/local-self-test.sh .
          ./woofc-namespace-platform -b spawn >& namespace.log &
          ./local-self-test.sh

          cp ../../cicd-tests/local-network-test.sh .
          ./woofc-namespace-platform -b spawn >& namespace.log &
          ./local-network-test.sh

          cp ../../cicd-tests/start-remote-platform.sh .
          cp ../../cicd-tests/kill-remote-platform.sh .
          cp ../../cicd-tests/remote-network-test.sh .
          ./remote-network-test.sh

          cp ../../cicd-tests/remote-senspot-test.sh .
          ./remote-senspot-test.sh

      - name: Build .deb package
        id: package
        run: |
          ARCH="${{ matrix.arch }}"
          PKG_NAME="cspot-${ARCH}.deb"

          PKG_DIR="pkg"
          rm -rf "$PKG_DIR"
          mkdir -p "$PKG_DIR/DEBIAN"
          mkdir -p "$PKG_DIR/usr/local/cspot/bin"
          mkdir -p "$PKG_DIR/usr/local/cspot/lib"
          mkdir -p "$PKG_DIR/usr/local/cspot/include"

          cp build/bin/woofc* "$PKG_DIR/usr/local/cspot/bin/"
          cp build/bin/senspot* "$PKG_DIR/usr/local/cspot/bin/"
          cp build/bin/stress* "$PKG_DIR/usr/local/cspot/bin/"
          cp build/bin/hw* "$PKG_DIR/usr/local/cspot/bin/"
          cp build/bin/ping* "$PKG_DIR/usr/local/cspot/bin/"
          cp build/lib/* "$PKG_DIR/usr/local/cspot/lib/" 2>/dev/null || true
          cp src/include/*.h "$PKG_DIR/usr/local/cspot/include/" 2>/dev/null || true

          # Write control file safely using echo
          echo "Package: cspot" > "$PKG_DIR/DEBIAN/control"
          echo "Version: 1.0-${GITHUB_RUN_NUMBER}" >> "$PKG_DIR/DEBIAN/control"
          echo "Architecture: ${ARCH}" >> "$PKG_DIR/DEBIAN/control"
          echo "Maintainer: Rich <rich@cs.ucsb.edu>" >> "$PKG_DIR/DEBIAN/control"
          echo "Description: CSPOT platform runtime (${ARCH})" >> "$PKG_DIR/DEBIAN/control"

          dpkg-deb --build "$PKG_DIR" "$PKG_NAME"

          echo "pkg=${PKG_NAME}" >> $GITHUB_OUTPUT

      - name: Upload package as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cspot-${{ matrix.arch }}
          path: ${{ steps.package.outputs.pkg }}

  publish-release:
    name: Publish Release Assets
    needs: build-and-package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*



